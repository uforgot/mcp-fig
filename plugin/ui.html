<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root { color-scheme: light dark; font: 12px/1.45 Inter, system-ui, sans-serif; }
    body { margin: 0; padding: 10px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 8px; }
    form { display: grid; gap: 8px; }
    label { display: grid; gap: 4px; font-weight: 600; }
    input { padding: 6px 8px; border: 1px solid #8888; border-radius: 5px; background: transparent; }
    button { padding: 7px; border: 0; border-radius: 5px; background: #0d99ff; color: white; font-weight: 700; }
    button.secondary { background: #8883; color: inherit; }
    #pairing-panel { grid-column: 1 / -1; }
    #connected-panel { grid-column: 2; grid-row: 1; }
    .actions { display: flex; gap: 4px; }
    .actions button { width: 28px; height: 28px; padding: 0; font-size: 16px; line-height: 1; }
    details { margin-top: 10px; }
    details form { margin-top: 8px; }
    #status { border-radius: 5px; word-break: break-word; }
    #pairing-panel:not([hidden]) ~ #status { grid-column: 1 / -1; grid-row: 2; margin-top: 8px; padding: 7px; background: #8882; }
    #connected-panel:not([hidden]) ~ #status { grid-column: 1; grid-row: 1; align-self: center; min-width: 0; padding: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    #connected-panel:not([hidden]) ~ #status.ok::before { content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: currentColor; }
    .ok { color: #16a34a; } .bad { color: #dc2626; }
  </style>
</head>
<body>
  <section id="pairing-panel">
    <form id="pair-form">
      <label>Bridge port <input id="port" inputmode="numeric" value="3847" /></label>
      <label>One-time pairing code <input id="pair-code" autocomplete="off" /></label>
      <button type="submit">Pair with MCP Fig</button>
    </form>
    <details>
      <summary>Manual development token</summary>
      <form id="manual-form">
        <label>Bridge port <input id="manual-port" inputmode="numeric" value="3847" /></label>
        <label>Session token <input id="token" type="password" autocomplete="off" /></label>
        <button type="submit">Connect manually</button>
      </form>
    </details>
  </section>
  <section id="connected-panel" hidden>
    <div class="actions">
      <button id="forget" type="button" class="secondary" title="Forget saved connection" aria-label="Forget saved connection">×</button>
      <button id="repair" type="button" title="Re-pair" aria-label="Re-pair">↻</button>
    </div>
  </section>
  <div id="status">Loading saved connection…</div>
  <script>
    const PROTOCOL = "mcp-fig-plugin/v1";
    const CAPABILITIES = [
      "document.read", "selection.read", "node.read", "node.write",
      "layout.write", "component.write", "instance.write", "tokens.write", "styles.write"
    ];

    class BridgeUiError extends Error {
      constructor(code, message, status) {
        super(message);
        this.code = code;
        this.status = status;
      }
    }

    function randomId() {
      if (
        typeof crypto !== "undefined" &&
        typeof crypto.randomUUID === "function"
      ) {
        return crypto.randomUUID();
      }
      return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
    }

    const sessionId = randomId();
    const sessionTraceId = randomId();
    const pluginClientId = `figma-plugin-ui:${sessionId}`;
    const statusNode = document.querySelector("#status");
    const pairingPanel = document.querySelector("#pairing-panel");
    const connectedPanel = document.querySelector("#connected-panel");
    let file = null;
    let controller = null;
    let bootstrapTimer;
    let reconnectAttempt = 0;
    let lastDisconnectReason = "not-paired";
    let refreshIdentity = null;
    let savedConfig = null;
    let configLoaded = false;
    let autoConnectStarted = false;
    const pending = new Map();
    const configPending = new Map();

    function setStatus(text, ok) {
      statusNode.textContent = text;
      statusNode.title = text;
      statusNode.className = ok === true ? "ok" : ok === false ? "bad" : "";
    }

    function setConnectionState(state, text, ok) {
      statusNode.dataset.state = state;
      statusNode.dataset.reconnectAttempt = String(reconnectAttempt);
      statusNode.dataset.lastDisconnectReason = lastDisconnectReason;
      setStatus(text, ok);
    }

    function showPairing() {
      pairingPanel.hidden = false;
      connectedPanel.hidden = true;
      pluginMessage({ type: "bridge-ui-resize", mode: "pairing" });
    }

    function showConnected() {
      pairingPanel.hidden = true;
      connectedPanel.hidden = false;
      pluginMessage({ type: "bridge-ui-resize", mode: "connected" });
    }

    function pluginMessage(message) {
      parent.postMessage({ pluginMessage: message }, "*");
    }

    function configRequest(operation, payload = {}) {
      return new Promise((resolve, reject) => {
        const requestId = `config-${operation}-${randomId()}`;
        const timer = setTimeout(() => {
          configPending.delete(requestId);
          reject(new BridgeUiError("STORAGE_ERROR", "Figma storage request timed out."));
        }, 5000);
        configPending.set(requestId, { resolve, reject, timer });
        pluginMessage({
          type: `bridge-config-${operation}`,
          requestId,
          ...payload,
        });
      });
    }

    function validConfig(config) {
      return (
        config && config.version === 1 && config.protocol === PROTOCOL &&
        Number.isInteger(config.port) && config.port >= 1 && config.port <= 65535 &&
        typeof config.credential === "string" &&
        config.credential.length >= 32 && config.credential.length <= 512
      );
    }

    function parsePort(value) {
      if (!/^\d+$/.test(value)) return null;
      const port = Number(value);
      return Number.isInteger(port) && port >= 1 && port <= 65535 ? port : null;
    }

    async function requestJson(url, options = {}) {
      const { timeoutMs = 7000, ...fetchOptions } = options;
      const timeoutController = new AbortController();
      const upstreamSignal = fetchOptions.signal;
      const abortFromUpstream = () => timeoutController.abort();
      if (upstreamSignal?.aborted) timeoutController.abort();
      else upstreamSignal?.addEventListener("abort", abortFromUpstream, { once: true });
      const timeout = setTimeout(() => timeoutController.abort(), timeoutMs);
      try {
        const response = await fetch(url, {
          ...fetchOptions,
          signal: timeoutController.signal,
        });
        if (response.status === 204) return null;
        let payload = {};
        try {
          payload = await response.json();
        } catch (error) {
          if (timeoutController.signal.aborted) throw error;
          payload = {};
        }
        if (!response.ok) {
          const serverCode = payload?.error?.code;
          const code = response.status === 401 ? "CREDENTIAL_EXPIRED" : serverCode || "REQUEST_FAILED";
          throw new BridgeUiError(
            code,
            payload?.error?.message || `Bridge request failed with ${response.status}.`,
            response.status,
          );
        }
        return payload;
      } catch (error) {
        if (error instanceof BridgeUiError) throw error;
        throw new BridgeUiError(
          "SERVICE_NOT_RUNNING",
          error instanceof Error ? error.message : "Bridge service is unavailable.",
        );
      } finally {
        clearTimeout(timeout);
        upstreamSignal?.removeEventListener("abort", abortFromUpstream);
      }
    }

    async function sendToMain(command) {
      return new Promise((resolve, reject) => {
        const timer = setTimeout(() => {
          pending.delete(command.requestId);
          reject(new Error(`Plugin command ${command.requestId} timed out.`));
        }, 5000);
        pending.set(command.requestId, { resolve, timer });
        pluginMessage({ type: "bridge-command", command });
      });
    }

    function waitForReconnect(delay, signal) {
      return new Promise((resolve) => {
        const timer = setTimeout(resolve, delay);
        signal.addEventListener("abort", () => {
          clearTimeout(timer);
          resolve();
        }, { once: true });
      });
    }

    function recoveryForPairing(error) {
      if (error.code === "PAIRING_EXPIRED") {
        return "Pairing code expired. Run `mcp-fig service pair` and enter the new code.";
      }
      if (error.code === "PAIRING_USED") {
        return "Pairing code was already used. Run `mcp-fig service pair` for a new code.";
      }
      if (error.code === "PROTOCOL_MISMATCH") {
        return "Protocol mismatch. Update MCP Fig, then Re-pair.";
      }
      if (error.code === "SERVICE_NOT_RUNNING") {
        return "Service not running. Run `mcp-fig service start`, then try the code again.";
      }
      return "Invalid pairing code. Run `mcp-fig service pair` and try again.";
    }

    async function clearSavedConfig() {
      await configRequest("clear");
      savedConfig = null;
    }

    function stopConnection() {
      controller?.abort();
      controller = null;
      refreshIdentity = null;
      reconnectAttempt = 0;
    }

    async function connectionLoop(config, signal, persistOnReady) {
      const base = `http://localhost:${config.port}`;
      const auth = {
        authorization: ["Bearer", config.credential].join(" "),
        "content-type": "application/json",
      };
      const publishIdentity = async () => {
        if (!file) throw new BridgeUiError("FILE_NOT_READY", "File identity is not ready.");
        const response = await requestJson(`${base}/v1/session/handshake`, {
          method: "POST",
          headers: auth,
          signal,
          body: JSON.stringify({
            protocol: PROTOCOL,
            traceId: sessionTraceId,
            sessionId,
            clientId: pluginClientId,
            file,
            capabilities: CAPABILITIES,
            sentAt: new Date().toISOString(),
          }),
        });
        if (response?.protocol !== PROTOCOL) {
          throw new BridgeUiError("PROTOCOL_MISMATCH", "Bridge protocol does not match the Plugin.");
        }
      };
      refreshIdentity = publishIdentity;
      let backoff = 250;
      let needsPersist = persistOnReady;

      while (!signal.aborted) {
        try {
          setConnectionState(
            reconnectAttempt === 0 ? "connecting" : "reconnecting",
            reconnectAttempt === 0 ? "Connecting…" : `Reconnect attempt ${reconnectAttempt}…`,
          );
          await publishIdentity();
          if (needsPersist) {
            await configRequest("set", { config });
            savedConfig = config;
            needsPersist = false;
          }
          reconnectAttempt = 0;
          lastDisconnectReason = "none";
          showConnected();
          setConnectionState("ready", "Connected", true);
          statusNode.title = `Connected: ${file.name}`;
          backoff = 250;

          while (!signal.aborted) {
            const command = await requestJson(
              `${base}/v1/session/${encodeURIComponent(sessionId)}/next`,
              {
                headers: { authorization: ["Bearer", config.credential].join(" ") },
                signal,
                timeoutMs: 3000,
              },
            );
            if (!command) continue;
            const receivedAt = new Date().toISOString();
            const pluginReceivedAt = receivedAt;
            let result;
            if (
              command.protocol !== PROTOCOL || command.sessionId !== sessionId ||
              command.fileKey !== file.key || typeof command.requestId !== "string"
            ) {
              result = {
                protocol: PROTOCOL,
                traceId: command.traceId,
                requestId: command.requestId || "invalid",
                clientId: command.clientId || "invalid",
                sessionId,
                fileKey: file.key,
                ok: false,
                error: { code: "FILE_NOT_TARGETED", message: "Command target does not match this plugin session." },
                receivedAt,
                pluginReceivedAt,
                figmaApiStartedAt: pluginReceivedAt,
                figmaApiCompletedAt: new Date().toISOString(),
                sceneTraversalNodeCount: 0,
                completedAt: new Date().toISOString(),
              };
            } else {
              const mainResult = await sendToMain(command);
              if (mainResult.revision) file.revision = mainResult.revision;
              result = {
                protocol: PROTOCOL,
                traceId: command.traceId,
                requestId: command.requestId,
                clientId: command.clientId,
                sessionId,
                fileKey: file.key,
                ok: mainResult.ok,
                revision: file.revision,
                ...(mainResult.ok ? { data: mainResult.data } : { error: mainResult.error }),
                pluginReceivedAt,
                figmaApiStartedAt: mainResult.figmaApiStartedAt,
                figmaApiCompletedAt: mainResult.figmaApiCompletedAt,
                sceneTraversalNodeCount: mainResult.sceneTraversalNodeCount,
                receivedAt,
                completedAt: new Date().toISOString(),
              };
            }
            await requestJson(`${base}/v1/session/${encodeURIComponent(sessionId)}/result`, {
              method: "POST",
              headers: auth,
              signal,
              body: JSON.stringify(result),
            });
          }
        } catch (error) {
          if (signal.aborted) return;
          const bridgeError = error instanceof BridgeUiError
            ? error
            : new BridgeUiError("REQUEST_FAILED", error?.message || String(error));
          lastDisconnectReason = bridgeError.code;

          if (bridgeError.code === "CREDENTIAL_EXPIRED") {
            await clearSavedConfig().catch(() => undefined);
            showPairing();
            setConnectionState(
              "credential-expired",
              "Credential expired or was rotated. Re-pair with a new one-time code.",
              false,
            );
            return;
          }
          if (bridgeError.code === "PROTOCOL_MISMATCH") {
            showPairing();
            setConnectionState(
              "protocol-mismatch",
              "Protocol mismatch. Update MCP Fig, then Re-pair.",
              false,
            );
            return;
          }

          reconnectAttempt += 1;
          const delay = Math.min(backoff, 5000);
          const serviceStopped = bridgeError.code === "SERVICE_NOT_RUNNING";
          setConnectionState(
            serviceStopped ? "service-not-running" : "reconnecting",
            serviceStopped
              ? `Service not running. Run \`mcp-fig service start\`. Retrying in ${delay}ms…`
              : `Reconnecting in ${delay}ms…`,
            false,
          );
          await waitForReconnect(delay, signal);
          backoff = Math.min(backoff * 2, 5000);
        }
      }
    }

    function startConnection(config, persistOnReady) {
      stopConnection();
      autoConnectStarted = true;
      controller = new AbortController();
      void connectionLoop(config, controller.signal, persistOnReady);
    }

    function maybeAutoConnect() {
      if (!file || !configLoaded || autoConnectStarted) return;
      if (!validConfig(savedConfig)) {
        showPairing();
        setConnectionState("pairing-required", `Ready: ${file.name}. Enter a one-time pairing code.`);
        return;
      }
      autoConnectStarted = true;
      startConnection(savedConfig, false);
    }

    window.onmessage = (event) => {
      const message = event.data?.pluginMessage;
      if (!message) return;
      if (message.type === "bridge-bootstrap") {
        file = message.file;
        if (bootstrapTimer) clearInterval(bootstrapTimer);
        if (refreshIdentity) void refreshIdentity().catch(() => undefined);
        maybeAutoConnect();
        return;
      }
      if (message.type === "bridge-config-result") {
        const entry = configPending.get(message.requestId);
        if (!entry) return;
        configPending.delete(message.requestId);
        clearTimeout(entry.timer);
        if (message.ok) entry.resolve(message);
        else entry.reject(new BridgeUiError(message.error?.code || "STORAGE_ERROR", message.error?.message || "Storage request failed."));
        return;
      }
      if (message.type === "bridge-result") {
        const entry = pending.get(message.requestId);
        if (entry) {
          pending.delete(message.requestId);
          clearTimeout(entry.timer);
          entry.resolve(message);
        }
      }
    };

    document.querySelector("#pair-form").onsubmit = (event) => {
      event.preventDefault();
      if (!file) return setStatus("File identity is not ready.", false);
      const port = parsePort(document.querySelector("#port").value.trim());
      const codeNode = document.querySelector("#pair-code");
      const code = codeNode.value.trim();
      codeNode.value = "";
      if (!port || code.length < 6) {
        return setStatus("Enter a valid port and one-time pairing code.", false);
      }
      stopConnection();
      setConnectionState("pairing", "Exchanging one-time pairing code…");
      void requestJson(`http://localhost:${port}/v1/pair/exchange`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ protocol: PROTOCOL, code }),
      }).then((response) => {
        if (response?.protocol !== PROTOCOL) {
          throw new BridgeUiError("PROTOCOL_MISMATCH", "Pairing protocol does not match the Plugin.");
        }
        const config = {
          version: 1,
          protocol: PROTOCOL,
          port,
          credential: response?.credential,
        };
        if (!validConfig(config)) {
          throw new BridgeUiError("PAIRING_INVALID", "Pairing response did not contain a valid credential.");
        }
        startConnection(config, true);
      }).catch((error) => {
        const bridgeError = error instanceof BridgeUiError
          ? error
          : new BridgeUiError("PAIRING_INVALID", "Pairing failed.");
        showPairing();
        setConnectionState("pairing-required", recoveryForPairing(bridgeError), false);
      });
    };

    document.querySelector("#manual-form").onsubmit = (event) => {
      event.preventDefault();
      if (!file) return setStatus("File identity is not ready.", false);
      const port = parsePort(document.querySelector("#manual-port").value.trim());
      const tokenNode = document.querySelector("#token");
      const credential = tokenNode.value;
      tokenNode.value = "";
      if (!port || credential.length < 1) {
        return setStatus("Enter a valid port and development token.", false);
      }
      const persist = credential.length >= 32 && credential.length <= 512;
      startConnection(
        { version: 1, protocol: PROTOCOL, port, credential },
        persist,
      );
    };

    async function forget(message) {
      stopConnection();
      await clearSavedConfig().catch(() => undefined);
      autoConnectStarted = false;
      showPairing();
      setConnectionState("pairing-required", message, true);
    }

    document.querySelector("#forget").onclick = () => {
      void forget("Forgotten. Enter a one-time pairing code to connect again.");
    };
    document.querySelector("#repair").onclick = () => {
      void forget("Ready to Re-pair. Run `mcp-fig service pair` and enter the new code.");
    };

    bootstrapTimer = setInterval(() => {
      if (file) return clearInterval(bootstrapTimer);
      pluginMessage({ type: "bridge-bootstrap" });
    }, 250);
    pluginMessage({ type: "bridge-bootstrap" });
    void configRequest("get").then((result) => {
      savedConfig = result.config;
      configLoaded = true;
      maybeAutoConnect();
    }).catch(() => {
      configLoaded = true;
      showPairing();
      setConnectionState(
        "storage-error",
        "Could not read the saved connection. Re-open the Plugin or pair again.",
        false,
      );
    });
  </script>
</body>
</html>
