name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run smoke
      - run: python3 scripts/verify-api-design.py
      - run: python3 scripts/verify-tool-audit.py
      - name: Verify generated quality snapshots are current
        run: |
          npm run snapshots:update
          git diff --exit-code -- tests/snapshots
